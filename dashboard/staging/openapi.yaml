swagger: "2.0"
info:
  contact:
    email: info@aircouch.com
    name: Inspried Tech
    url: https://www.inspiredtech.ca
  description: API for Project X dashoard.
  termsOfService: https://www.inspiredtech.ca/terms
  title: project-x-api-dashboard
  version: 1.0.0
host: "project-x-dashboard-staging-gateway-8ua0taf7.uc.gateway.dev"
x-google-endpoints:
  - name: "project-x-dashboard-staging-gateway-8ua0taf7.uc.gateway.dev"
    allowCors: True
basePath: /api/v1
schemes:
  - https
consumes:
  - application/json
produces:
  - application/json
tags:
  - description: dashboard heartbeat
    name: heartbeat
  - description: Dashboard Authentication
    name: auth
  - description: User Management
    name: user
  - description: Booking Management
    name: booking
  - description: Listing Management
    name: listing
  - description: Review Management
    name: review
  - description: CORs
    name: cors
paths:
  /dashboard/{proxy}:
    options:
      summary: CORS support
      operationId: corsAny
      tags:
        - cors
      x-google-allow: all
      x-google-backend:
        address: https://dashboard-service-ee3nwblsmq-uc.a.run.app
        path_translation: APPEND_PATH_TO_ADDRESS
      parameters:
        - name: proxy
          in: path
          required: true
          type: string
      responses:
        "204":
          description: Preflight OK

  /dashboard/{proxy}/{proxy1}:
    options:
      summary: CORS support
      operationId: corsAny1
      tags:
        - cors
      x-google-allow: all
      x-google-backend:
        address: https://dashboard-service-ee3nwblsmq-uc.a.run.app
        path_translation: APPEND_PATH_TO_ADDRESS
      parameters:
        - name: proxy
          in: path
          required: true
          type: string
        - name: proxy1
          in: path
          required: true
          type: string
      responses:
        "204":
          description: Preflight OK

  /dashboard/{proxy}/{proxy1}/{proxy2}:
    options:
      summary: CORS support
      operationId: corsAny2
      tags:
        - cors
      x-google-allow: all
      x-google-backend:
        address: https://dashboard-service-ee3nwblsmq-uc.a.run.app
        path_translation: APPEND_PATH_TO_ADDRESS
      parameters:
        - name: proxy
          in: path
          required: true
          type: string
        - name: proxy1
          in: path
          required: true
          type: string
        - name: proxy2
          in: path
          required: true
          type: string
      responses:
        "204":
          description: Preflight OK

  # --- Health check routes ---
  /dashboard/heartbeat:
    get:
      summary: Dashboard service heartbeat
      operationId: heartbeat
      tags:
        - heartbeat
      x-google-backend:
        address: https://dashboard-service-ee3nwblsmq-uc.a.run.app
        path_translation: APPEND_PATH_TO_ADDRESS
      responses:
        "200":
          description: Heartbeat
          schema:
            example: OK
            type: string
        "400":
          description: Bad request
          schema:
            $ref: "#/definitions/Error400Response"

  /dashboard/heartbeat/services:
    get:
      summary: Health check for all backend services
      operationId: allServicesHeartBeat
      tags:
        - heartbeat
      x-google-backend:
        address: https://dashboard-service-ee3nwblsmq-uc.a.run.app
        path_translation: APPEND_PATH_TO_ADDRESS
      security:
        - jwtAuth: []
      responses:
        "200":
          description: Heartbeat
          schema:
            properties:
              status:
                example: ok
                type: string
              services:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    status:
                      type: string
                    path:
                      type: string
        "400":
          description: Bad request
          schema:
            $ref: "#/definitions/Error400Response"

  # --- Authentication routes ---
  /dashboard/auth/login/email:
    post:
      summary: Login by email
      operationId: loginByEmail
      tags:
        - auth
      x-google-backend:
        address: https://dashboard-service-ee3nwblsmq-uc.a.run.app
        path_translation: APPEND_PATH_TO_ADDRESS
      parameters:
        - in: body
          name: body
          schema:
            type: object
            properties:
              email:
                format: email
                type: string
              password:
                format: password
                type: string
            required:
              - email
              - password
      responses:
        "200":
          description: Authenticated User | token will be stored in the cookies
          schema:
            type: object
            properties:
              status:
                example: ok
                type: string
              user:
                $ref: "#/definitions/UserSummary"
        "400":
          description: Invalid body
          schema:
            $ref: "#/definitions/Error400Response"

  /dashboard/auth/logout:
    post:
      summary: Logout the current user
      operationId: logoutUser
      tags:
        - auth
      x-google-backend:
        address: https://dashboard-service-ee3nwblsmq-uc.a.run.app
        path_translation: APPEND_PATH_TO_ADDRESS
      responses:
        "200":
          description: Logout successful
          schema:
            type: object
            properties:
              status:
                example: ok
                type: string
              message:
                type: string
                example: User logged out successfully
        "400":
          description: Invalid body
          schema:
            $ref: "#/definitions/Error400Response"

  /dashboard/auth/session:
    get:
      summary: Get current sessions
      operationId: getCurrentUserSession
      tags:
        - auth
      x-google-backend:
        address: https://dashboard-service-ee3nwblsmq-uc.a.run.app
        path_translation: APPEND_PATH_TO_ADDRESS
      responses:
        "200":
          description: Authenticated User | Validate user by token in the cookies
          schema:
            type: object
            properties:
              status:
                example: ok
                type: string
              user:
                $ref: "#/definitions/UserSummary"
        "400":
          description: Invalid body
          schema:
            $ref: "#/definitions/Error400Response"

  # --- User management ---
  /dashboard/users:
    get:
      summary: List/Search users
      operationId: getUsers
      tags:
        - user
      x-google-backend:
        address: https://dashboard-service-ee3nwblsmq-uc.a.run.app
        path_translation: APPEND_PATH_TO_ADDRESS
      security:
        - jwtAuth: []
      parameters:
        - default: 1
          description: Page number
          in: query
          minimum: 0
          name: page
          type: integer
        - default: 10
          description: Results per page
          in: query
          minimum: 0
          name: limit
          type: integer
        - description: Search query (name, email, id, etc)
          in: query
          name: query
          type: string
        - description: Filter by user status
          enum:
            - activate
            - ban
            - deleted
            - pending
          in: query
          name: status
          type: string
      responses:
        "200":
          description: List of users
          schema:
            type: object
            properties:
              limit:
                example: 10
                type: integer
              page:
                example: 1
                type: integer
              pages:
                example: 1
                type: integer
              status:
                example: ok
                type: string
              total:
                example: 2
                type: integer
              users:
                items:
                  $ref: "#/definitions/UserSummary"
                type: array
        "400":
          description: Invalid query
          schema:
            $ref: "#/definitions/Error400Response"

  /dashboard/users/{id}:
    delete:
      summary: Delete a user
      operationId: deleteUserById
      tags:
        - user
      x-google-backend:
        address: https://dashboard-service-ee3nwblsmq-uc.a.run.app
        path_translation: APPEND_PATH_TO_ADDRESS
      security:
        - jwtAuth: []
      parameters:
        - description: User ID
          in: path
          maxLength: 32
          name: id
          required: true
          type: string
        - default: soft
          description: Delete type
          enum:
            - soft
            - hard
          in: query
          name: option
          type: string
      responses:
        "200":
          description: Success
          schema:
            type: object
            properties:
              status:
                example: ok
                type: string
              user_id:
                type: string
        "404":
          description: User Not found
          schema:
            $ref: "#/definitions/Error404Response"
    get:
      summary: Get a user detail
      operationId: getUserById
      tags:
        - user
      x-google-backend:
        address: https://dashboard-service-ee3nwblsmq-uc.a.run.app
        path_translation: APPEND_PATH_TO_ADDRESS
      security:
        - jwtAuth: []
      parameters:
        - description: User ID
          in: path
          maxLength: 32
          name: id
          required: true
          type: string
      responses:
        "200":
          description: User detail
          schema:
            type: object
            properties:
              status:
                example: ok
                type: string
              user:
                $ref: "#/definitions/User"
        "404":
          description: User Not found
          schema:
            $ref: "#/definitions/Error404Response"
    put:
      summary: Update user
      operationId: updateUserById
      tags:
        - user
      x-google-backend:
        address: https://dashboard-service-ee3nwblsmq-uc.a.run.app
        path_translation: APPEND_PATH_TO_ADDRESS
      security:
        - jwtAuth: []
      parameters:
        - in: path
          name: id
          required: true
          type: string
        - in: body
          name: user
          required: true
          schema:
            $ref: "#/definitions/UserAdminUpdateRequest"
      responses:
        "200":
          description: User updated
        "400":
          description: Invalid request

  /dashboard/users/{id}/verify:
    put:
      summary: Restore/Revoke a user verification
      tags:
        - user
      operationId: verifyUser
      x-google-backend:
        address: https://dashboard-service-ee3nwblsmq-uc.a.run.app
        path_translation: APPEND_PATH_TO_ADDRESS
      security:
        - jwtAuth: []
      parameters:
        - name: id
          in: path
          description: User ID
          required: true
          type: string
          maxLength: 32
        - name: verify
          in: body
          description: User verified status
          required: true
          schema:
            type: object
            properties:
              verified:
                type: string
                example: "true"
                enum:
                  - true
                  - false
      responses:
        "200":
          description: Success
          schema:
            type: object
            properties:
              status:
                type: string
                example: ok
              user_id:
                type: string
                example: user_id123
        "400":
          description: Invalid User ID
          schema:
            $ref: "#/definitions/Error400Response"
        "404":
          description: User not found
          schema:
            $ref: "#/definitions/Error404Response"

  /dashboard/users/{id}/status:
    put:
      summary: Update user status
      operationId: updateUserStatus
      tags:
        - user
      x-google-backend:
        address: https://dashboard-service-ee3nwblsmq-uc.a.run.app
        path_translation: APPEND_PATH_TO_ADDRESS
      security:
        - jwtAuth: []
      parameters:
        - description: User ID
          in: path
          maxLength: 32
          name: id
          required: true
          type: string
        - in: body
          name: status
          schema:
            type: object
            properties:
              status:
                enum:
                  - activate
                  - ban
                  - deleted
                  - pending
                type: string
            required:
              - status
      responses:
        "200":
          description: Success
          schema:
            type: object
            properties:
              status:
                example: ok
                type: string
              user_id:
                type: string
        "404":
          description: Not found
          schema:
            $ref: "#/definitions/Error404Response"

  /dashboard/users/{id}/sendMessage:
    post:
      summary: Send message to an User
      tags:
        - user
      operationId: userSendMessage
      x-google-backend:
        address: https://dashboard-service-ee3nwblsmq-uc.a.run.app
        path_translation: APPEND_PATH_TO_ADDRESS
      security:
        - jwtAuth: []
      parameters:
        - description: User ID
          in: path
          maxLength: 32
          name: id
          required: true
          type: string
        - in: body
          name: message
          schema:
            type: object
            properties:
              message:
                type: string
            required:
              - message
      responses:
        "200":
          description: Success
          schema:
            type: object
            properties:
              status:
                type: string
                example: ok
              toast:
                type: string
                example: Message sent successfully
        "404":
          description: Not found
          schema:
            $ref: "#/definitions/Error404Response"

  /dashboard/users/{id}/ban:
    post:
      operationId: banUser
      parameters:
        - in: path
          name: id
          required: true
          type: string
        - in: body
          name: reason
          required: true
          schema:
            properties:
              reason:
                type: string
            type: object
      responses:
        "200":
          description: User banned
      security:
        - jwtAuth: []
      summary: Ban or suspend a user
      tags:
        - user
      x-google-backend:
        address: https://dashboard-service-ee3nwblsmq-uc.a.run.app
        path_translation: APPEND_PATH_TO_ADDRESS

  /dashboard/users/{id}/export:
    get:
      operationId: exportUserData
      parameters:
        - in: path
          name: id
          required: true
          type: string
      responses:
        "200":
          description: User data export
      security:
        - jwtAuth: []
      summary: Export user data
      tags:
        - user
      x-google-backend:
        address: https://dashboard-service-ee3nwblsmq-uc.a.run.app
        path_translation: APPEND_PATH_TO_ADDRESS

  /dashboard/users/{id}/impersonate:
    post:
      operationId: impersonateUser
      parameters:
        - in: path
          name: id
          required: true
          type: string
      responses:
        "200":
          description: Impersonation token/session
      security:
        - jwtAuth: []
      summary: Impersonate user (admin login as user)
      tags:
        - user
      x-google-backend:
        address: https://dashboard-service-ee3nwblsmq-uc.a.run.app
        path_translation: APPEND_PATH_TO_ADDRESS

  /dashboard/users/profile/picture:
    put:
      summary: Update admin's profile picture
      tags:
        - user
      operationId: updateAdminProfilePicture
      x-google-backend:
        address: https://dashboard-service-ee3nwblsmq-uc.a.run.app
        path_translation: APPEND_PATH_TO_ADDRESS
      parameters:
        - in: body
          name: file
          required: true
          description: Raw binary image file (PNG, JPEG, or GIF)
          schema:
            type: string
            format: binary
      responses:
        "200":
          description: Profile picture updated successfully
          schema:
            type: object
            properties:
              status:
                type: string
                example: ok
              user_id:
                type: string
              url:
                type: string
                example: https://unsplash.com/photos/yellow-flowers-bloom-beneath-a-reaching-shadow-0FPDfErlKzQ

  # --- Booking Management ---
  /dashboard/bookings:
    get:
      summary: List/search bookings
      operationId: getBookings
      tags:
        - booking
      x-google-backend:
        address: https://dashboard-service-ee3nwblsmq-uc.a.run.app
        path_translation: APPEND_PATH_TO_ADDRESS
      security:
        - jwtAuth: []
      parameters:
        - default: 1
          description: Page number
          in: query
          minimum: 0
          name: page
          required: false
          type: integer
        - default: 10
          description: Results per page
          in: query
          minimum: 0
          name: limit
          required: false
          type: integer
        - description: Search query (host, guest, id, etc)
          in: query
          name: query
          required: false
          type: string
        - description: Filter by booking status
          enum:
            - completed
            - flagged
            - cancelled
            - pending
            - accepted
          in: query
          name: status
          required: false
          type: string
      responses:
        "200":
          description: Success
          schema:
            type: object
            properties:
              status:
                type: string
                example: ok
              total:
                type: integer
                example: 2
              page:
                type: integer
                example: 1
              limit:
                type: integer
                example: 10
              pages:
                type: integer
                example: 1
              bookings:
                type: array
                items:
                  $ref: "#/definitions/BookingSummary"

  /dashboard/bookings/{id}:
    get:
      summary: Get booking detail
      operationId: getBookingById
      tags:
        - booking
      x-google-backend:
        address: https://dashboard-service-ee3nwblsmq-uc.a.run.app
        path_translation: APPEND_PATH_TO_ADDRESS
      security:
        - jwtAuth: []
      parameters:
        - in: path
          name: id
          required: true
          type: string
      responses:
        "200":
          description: Success
          schema:
            type: object
            properties:
              status:
                type: string
                example: ok
              booking:
                $ref: "#/definitions/Booking"
        "404":
          description: Booking not found
    delete:
      operationId: deleteBookingById
      parameters:
        - in: path
          name: id
          required: true
          type: string
      responses:
        "204":
          description: Booking deleted
      security:
        - jwtAuth: []
      summary: Delete booking (admin)
      tags:
        - booking
      x-google-backend:
        address: https://dashboard-service-ee3nwblsmq-uc.a.run.app
        path_translation: APPEND_PATH_TO_ADDRESS
    patch:
      operationId: updateBookingById
      parameters:
        - in: path
          name: id
          required: true
          type: string
        - in: body
          name: booking
          required: true
          schema:
            $ref: "#/definitions/BookingAdminUpdateRequest"
      responses:
        "200":
          description: Booking updated
      security:
        - jwtAuth: []
      summary: Update booking (admin)
      tags:
        - booking
      x-google-backend:
        address: https://dashboard-service-ee3nwblsmq-uc.a.run.app
        path_translation: APPEND_PATH_TO_ADDRESS

  /dashboard/bookings/{id}/export:
    get:
      operationId: exportBookingData
      parameters:
        - in: path
          name: id
          required: true
          type: string
      responses:
        "200":
          description: Booking data export
      security:
        - jwtAuth: []
      summary: Export booking data
      tags:
        - booking
      x-google-backend:
        address: https://dashboard-service-ee3nwblsmq-uc.a.run.app
        path_translation: APPEND_PATH_TO_ADDRESS

  /dashboard/bookings/{id}/refund:
    post:
      operationId: refundBooking
      parameters:
        - in: path
          name: id
          required: true
          type: string
        - in: body
          name: refund
          required: true
          schema:
            properties:
              amount:
                format: float
                type: number
              reason:
                type: string
            type: object
      responses:
        "200":
          description: Refund processed
      security:
        - jwtAuth: []
      summary: Refund booking
      tags:
        - booking
      x-google-backend:
        address: https://dashboard-service-ee3nwblsmq-uc.a.run.app
        path_translation: APPEND_PATH_TO_ADDRESS

  # --- Listing Management ---
  /dashboard/listings:
    get:
      summary: List/Search listing
      operationId: getListings
      tags:
        - listing
      x-google-backend:
        address: https://dashboard-service-ee3nwblsmq-uc.a.run.app
        path_translation: APPEND_PATH_TO_ADDRESS
      security:
        - jwtAuth: []
      parameters:
        - default: 1
          description: Page number
          in: query
          minimum: 0
          name: page
          type: integer
        - default: 10
          description: Results per page
          in: query
          minimum: 0
          name: limit
          type: integer
        - description: Search query
          in: query
          name: query
          type: string
      responses:
        "200":
          description: Success
          schema:
            type: object
            properties:
              status:
                type: string
                example: ok
              listings:
                type: array
                items:
                  $ref: "#/definitions/ListingSummary"

  /dashboard/listings/{id}:
    delete:
      operationId: deleteListingById
      parameters:
        - in: path
          name: id
          required: true
          type: string
      responses:
        "204":
          description: Listing deleted
      security:
        - jwtAuth: []
      summary: Delete listing (admin)
      tags:
        - listing
      x-google-backend:
        address: https://dashboard-service-ee3nwblsmq-uc.a.run.app
        path_translation: APPEND_PATH_TO_ADDRESS
    get:
      summary: Get a listing detail
      operationId: getListingById
      tags:
        - listing
      x-google-backend:
        address: https://dashboard-service-ee3nwblsmq-uc.a.run.app
        path_translation: APPEND_PATH_TO_ADDRESS
      security:
        - jwtAuth: []
      parameters:
        - name: id
          in: path
          description: Listing ID
          required: true
          type: string
          maxLength: 32
      responses:
        "200":
          description: Success
          schema:
            type: object
            properties:
              status:
                type: string
                example: ok
              listing:
                $ref: "#/definitions/Listing"
        "400":
          description: Invalid listing ID
          schema:
            $ref: "#/definitions/Error400Response"
        "404":
          description: Listing not found
          schema:
            $ref: "#/definitions/Error404Response"
    patch:
      operationId: updateListingById
      parameters:
        - in: path
          name: id
          required: true
          type: string
        - in: body
          name: listing
          required: true
          schema:
            $ref: "#/definitions/ListingAdminUpdateRequest"
      responses:
        "200":
          description: Listing updated
      security:
        - jwtAuth: []
      summary: Update listing (admin)
      tags:
        - listing
      x-google-backend:
        address: https://dashboard-service-ee3nwblsmq-uc.a.run.app
        path_translation: APPEND_PATH_TO_ADDRESS

  /dashboard/listings/{id}/verify:
    put:
      summary: Restore/Revoke a listing verification
      operationId: verifyListing
      tags:
        - listing
      x-google-backend:
        address: https://dashboard-service-ee3nwblsmq-uc.a.run.app
        path_translation: APPEND_PATH_TO_ADDRESS
      security:
        - jwtAuth: []
      parameters:
        - name: id
          in: path
          description: Listing ID
          required: true
          type: string
          maxLength: 32
        - name: verify
          in: body
          description: Listing verified status
          required: true
          schema:
            type: object
            properties:
              verified:
                type: string
                example: "true"
                enum:
                  - true
                  - false
      responses:
        "200":
          description: Success
          schema:
            type: object
            properties:
              status:
                type: string
                example: ok
              listing_id:
                type: string
        "400":
          description: Invalid listing ID
          schema:
            $ref: "#/definitions/Error400Response"
        "404":
          description: Listing not found
          schema:
            $ref: "#/definitions/Error404Response"

  /dashboard/listings/{id}/export:
    get:
      operationId: exportListingData
      parameters:
        - in: path
          name: id
          required: true
          type: string
      responses:
        "200":
          description: Listing data export
      security:
        - jwtAuth: []
      summary: Export listing data
      tags:
        - listing
      x-google-backend:
        address: https://dashboard-service-ee3nwblsmq-uc.a.run.app
        path_translation: APPEND_PATH_TO_ADDRESS
  /dashboard/listings/{id}/moderate:
    post:
      operationId: moderateListing
      parameters:
        - in: path
          name: id
          required: true
          type: string
        - in: body
          name: action
          required: true
          schema:
            properties:
              action:
                enum:
                  - approve
                  - reject
                type: string
              reason:
                type: string
            type: object
      responses:
        "200":
          description: Moderation result
      security:
        - jwtAuth: []
      summary: Moderate listing (approve/reject)
      tags:
        - listing
      x-google-backend:
        address: https://dashboard-service-ee3nwblsmq-uc.a.run.app
        path_translation: APPEND_PATH_TO_ADDRESS

  # --- Document Management ---
