        - default: 1
          description: Page number
          in: query
          minimum: 0
          name: page
          type: integer
        - default: 10
          description: Results per page
          in: query
          minimum: 0
          name: limit
          type: integer
        - description: Filter by user status
          enum:
            - visible
            - hidden
