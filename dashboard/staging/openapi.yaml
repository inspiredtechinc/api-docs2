      description: Forwards a chatbot request to the configured chatbot service, returning its response.
      operationId: proxyChatbot
      tags:
        - chatbot
      x-google-backend:
        address: https://dashboard-service-ee3nwblsmq-uc.a.run.app
        path_translation: APPEND_PATH_TO_ADDRESS
      security:
        - jwtAuth: []
      parameters:
        - in: body
          name: body
          description: Chatbot request payload
          required: true
          schema:
            $ref: "#/definitions/ProxyChatRequest"
      responses:
        200:
          description: Chatbot response
          schema:
            $ref: "#/definitions/ProxyChatResponse"
        400:
          description: Bad request
          schema:
            $ref: "#/definitions/DashboardError"
        401:
          description: Unauthorized (missing or invalid token)
