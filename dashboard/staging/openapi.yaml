    additionalProperties: false
    properties:
      status:
        type: string
        example: error
      error:
        type: object
        additionalProperties: false
        properties:
          code:
            type: integer
            example: 401
          message:
            type: string
            example: Unauthorized! Email or password is not correct
        required:
          - code
          - message
    required:
      - status
      - error

securityDefinitions:
  googleApiKey:
    in: header
    name: api_key
    type: apiKey
  jwtAuth:
    in: header
    name: Authorization
    type: apiKey
