definitions:
  AnalyticsOverviewResponse:
    type: object
    properties:
      total_users:
        type: integer
      total_listings:
        type: integer
      total_bookings:
        type: integer
      total_revenue:
        type: number
        format: double
      active_users:
        type: integer
      new_signups:
        type: integer
      period:
        type: string
        description: Analytics period (e.g. 'last_30_days')
  BookingAdminUpdateRequest:
    type: object
    properties:
      status:
        type: string
        enum:
          - pending
          - confirmed
          - cancelled
          - completed
          - disputed
      admin_notes:
        type: string
      refund_amount:
        type: number
        format: double
    required:
      - status
  ListingAdminUpdateRequest:
    type: object
    properties:
      title:
        type: string
      description:
        type: string
      status:
        type: string
        enum:
          - active
          - pending
          - rejected
          - removed
      price:
        type: number
        format: double
      max_guests:
        type: integer
      instant_book:
        type: boolean
      admin_notes:
        type: string
    required:
      - title
      - status
  Gender:
    type: string
    enum:
      - Male
      - Female
      - Non-binary
      - Transgender
      - Genderqueer
      - Genderfluid
      - Agender
      - Two-spirit
      - Bigender
      - Other
      - Prefer not to say
  User:
    type: object
    properties:
      id:
        type: string
      first_name:
        type: string
      last_name:
        type: string
      email:
        type: string
      bio:
        type: string
      avatar:
        type: string
        format: uri
      phone:
        type: string
      birthday:
        type: string
        format: date-time
      city:
        type: string
      country:
        type: string
        maxItems: 10
      interests:
        type: array
        items:
          type: string
        maxItems: 10
      languages:
        type: array
        items:
          type: string
        maxItems: 10
      verified:
        type: boolean
      status:
        type: string
      created_at:
        type: string
        format: date-time
      updated_at:
        type: string
        format: date-time
      gender:
        $ref: "#/definitions/Gender"
  UserSummary:
    type: object
    properties:
      id:
        type: string
      email:
        type: string
      first_name:
        type: string
      last_name:
        type: string
      role:
        type: string
      status:
        type: string
      permissions:
        type: array
        items:
          type: string
  Listing:
    type: object
    properties:
      id:
        type: string
        description: Unique ID of the listing
      title:
        type: string
      description:
        type: string
      active:
        type: boolean
      available:
        type: boolean
      baggage_drop:
        type: boolean
      instant_book:
        type: boolean
      verified:
        type: boolean
      cancellation_policy:
        type: string
      created_at:
        type: string
        format: date-time
      deleted:
        type: boolean
      max_guests:
        type: integer
      price:
        type: number
        format: float
      rating:
        type: number
        format: float
      reviews:
        type: string
      amenities:
        type: array
        items:
          type: string
      house_rules:
        type: array
        items:
          type: string
      photos:
        type: array
        items:
          type: string
        description: List of image URLs
      thumbnail:
        type: string
        description: URL to thumbnail image
      host:
        type: object
        properties:
          id:
            type: string
          first_name:
            type: string
          gender:
            type: string
          avatar:
            type: string
          rating:
            type: number
            format: float
      location:
        type: object
        properties:
          address:
            type: object
            properties:
              street:
                type: string
              unit_number:
                type: string
              city:
                type: string
              province:
                type: string
              postal_code:
                type: string
              country:
                type: string
              flag:
                type: string
          latitude:
            type: number
            format: float
          longitude:
            type: number
            format: float
          geohash:
            type: string
  ListingSummary:
    type: object
    properties:
      id:
        type: string
      active:
        type: boolean
      created_at:
        type: string
        format: date-time
      price:
        type: number
        format: float
      rating:
        type: number
        format: float
      host:
        type: object
        properties:
          id:
            type: string
          first_name:
            type: string
          gender:
            type: string
          avatar:
            type: string
          rating:
            type: number
            format: float
      location:
        type: object
        properties:
          address:
            type: object
            properties:
              street:
                type: string
              unit_number:
                type: string
              city:
                type: string
              province:
                type: string
              postal_code:
                type: string
              country:
                type: string
              flag:
                type: string
          latitude:
            type: number
            format: float
          longitude:
            type: number
            format: float
          geohash:
            type: string

  Booking:
    type: object
    properties:
      id:
        type: string
      listing_id:
        type: string
      payment_id:
        type: string
      check_in:
        type: string
        format: date-time
        example: "2025-06-01T14:00:00Z"
      check_out:
        type: string
        format: date-time
        example: "2025-06-05T11:00:00Z"
      created_at:
        type: string
        format: date-time
        example: "2025-06-05T11:00:00Z"
      amount:
        type: number
        format: float
        example: 500
      rating:
        type: number
        format: float
        example: 4.5
      days:
        type: integer
        example: 4
      guests:
        type: integer
        example: 2
      guest:
        type: string
      host:
        type: string
      status:
        type: string
        enum:
          - pending
          - accepted
          - rejected
          - cancelled
          - completed
          - awaiting_payment
        example: pending

  BookingSummary:
    type: object
    properties:
      id:
        type: string
        example: bkg_001
      check_in:
        type: string
        format: date-time
        example: "2025-06-01T14:00:00Z"
      check_out:
        type: string
        format: date-time
        example: "2025-06-05T11:00:00Z"
      host:
        type: string
      guest:
        type: string
      status:
        type: string
        enum:
          - pending
          - cancelled
          - completed
          - flagged
          - accepted
        example: pending

  Review:
    type: object
    properties:
      id:
        type: string
        description: Unique identifier for the review
      author:
        type: string
        description: ID of the user who wrote the review
      booking_id:
        type: string
        description: ID of the associated booking
      listing_id:
        type: string
        description: ID of the listing being reviewed
      category:
        type: string
        description: Category of the review (e.g. cleanliness)
      comment:
        type: string
        description: Text comment provided by the reviewer
      emoji_sentiment:
        type: string
      metrics:
        type: object
        properties:
          accuracy:
            type: number
            format: float
          check_in:
            type: number
            format: float
          cleanliness:
            type: number
            format: float
          communication:
            type: number
            format: float
          location:
            type: number
            format: float
          value:
            type: number
            format: float
      overall_rating:
        type: number
        format: float
      status:
        type: string
        description: Moderation status of the review
      target:
        type: string
        description: The entity this review targets (e.g., listing ID)
      type:
        type: string
        description: Type of target (e.g., "listing")
      created_at:
        type: string
        format: date-time
      updated_at:
        type: string
        format: date-time
      version:
        type: integer
        description: Review version number
      edit_history:
        type: array
      hidden:
        type: boolean

  ReviewSummary:
    type: object
    properties:
      id:
        type: string
        description: Unique identifier for the review
      author:
        type: string
        description: ID of the user who wrote the review
      booking_id:
        type: string
        description: ID of the associated booking
      listing_id:
        type: string
        description: ID of the listing being reviewed
      category:
        type: string
        description: Category of the review (e.g. cleanliness)
      comment:
        type: string
        description: Text comment provided by the reviewer
      emoji_sentiment:
        type: string
      metrics:
        type: object
        properties:
          accuracy:
            type: number
            format: float
          check_in:
            type: number
            format: float
          cleanliness:
            type: number
            format: float
          communication:
            type: number
            format: float
          location:
            type: number
            format: float
          value:
            type: number
            format: float
      overall_rating:
        type: number
        format: float
      status:
        type: string
      hidden:
        type: boolean
      created_at:
        type: string
        format: date-time
      updated_at:
        type: string
        format: date-time

  Error400Response:
    type: object
    properties:
      status:
        type: string
        example: error
      error:
        type: object
        properties:
          code:
            type: integer
            example: 400
          message:
            type: string
            example: Invalid request
    required:
      - status
      - error

  NotificationRequest:
    type: object
    required:
      - message
    properties:
      message:
        type: string
      user_id:
        type: string
      type:
        type: string
        enum:
          - info
          - warning
          - alert
          - success
      data:
        type: object

  Error404Response:
    type: object
    properties:
      status:
        type: string
        example: error
      error:
        type: object
        properties:
          code:
            type: integer
            example: 404
          message:
            type: string
            example: Not found
    required:
      - status
      - error

  SettingsResponse:
    type: object
    properties:
      maintenance_mode:
        type: boolean
      feature_toggles:
        type: object
        additionalProperties:
          type: boolean
      notification_templates:
        type: object
        additionalProperties:
          type: string
      updated_at:
        type: string
        format: date-time

  SettingsUpdateRequest:
    type: object
    properties:
      maintenance_mode:
        type: boolean
      feature_toggles:
        type: object
        additionalProperties:
          type: boolean
      notification_templates:
        type: object
        additionalProperties:
          type: string

  UserAdminUpdateRequest:
    type: object
    properties:
      first_name:
        type: string
      last_name:
        type: string
      email:
        type: string
      phone:
        type: string
      status:
        type: string
        enum:
          - active
          - suspended
          - banned
          - pending
      role:
        type: string
        enum:
          - user
          - admin
          - moderator
      verified:
        type: boolean
    required:
      - email

securityDefinitions:
  googleApiKey:
    in: header
    name: api_key
    type: apiKey
  jwtAuth:
    in: header
    name: Authorization
    type: apiKey
